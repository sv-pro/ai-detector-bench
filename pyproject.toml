[project]
name = "detbench"
version = "0.1.0"
description = "A referee for AI-text detectors: measures them at deployment-relevant operating points, and publishes where they fail."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sv-pro" }]
keywords = ["ai-detection", "llm", "benchmark", "machine-generated-text", "provenance"]

# The core is deliberately dependency-free: contracts, metrics, attacks and the
# stylometric baseline run on a bare interpreter. Every model-bearing detector is
# an optional extra, so `pip install detbench` never pulls a gigabyte of torch.
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.2", "transformers>=4.40"]
dev = ["pytest>=8.0"]

[project.scripts]
detbench = "detbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
